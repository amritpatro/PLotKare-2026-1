<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#C0392B">
    <title>PlotKare Field | Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F9FAFB; color: #1F2937; font: 16px Arial, sans-serif; padding: 24px; }
      main { max-width: 420px; border: 1px solid #E5E7EB; border-radius: 8px; background: white; padding: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
      .mark { width: 32px; height: 44px; border-left: 5px solid #C0392B; border-top: 5px solid #C0392B; margin-bottom: 20px; }
      small { color: #C9A962; text-transform: uppercase; letter-spacing: 2px; }
      h1 { margin: 12px 0; font-family: Georgia, serif; font-size: 28px; }
      p { margin: 0; color: #6B7280; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <small>PlotKare Field</small>
      <h1>You are offline</h1>
      <p>Evidence already captured in an open inspection is saved on this device. Reconnect and reopen the inspection to sync it securely.</p>
    </main>
  </body>
</html>
